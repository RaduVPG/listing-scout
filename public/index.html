<style>
:root{--bg:#0a0a0f;--surface:#111118;--surface2:#18181f;--surface3:#20202a;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);--text:#f0f0f5;--muted:#6b6b80;--muted2:#9090a8;--pump:#00e5a0;--dump:#ff4d6d;--neutral:#f5c542;--accent2:#a78bfa;--mono:'Space Mono',monospace;--sans:'Syne',sans-serif;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden}
.topbar{position:sticky;top:0;z-index:100;background:rgba(10,10,15,0.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:calc(var(--safe-top) + 12px) 16px 12px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:17px;font-weight:800;letter-spacing:-0.02em;display:flex;align-items:center;gap:8px}
.logo-dot{width:8px;height:8px;border-radius:50%;background:var(--pump);animation:pulse 2s infinite}

@keyframes spin{to{transform:rotate(360deg)}}
.refresh-btn{background:var(--surface2);border:1px solid var(--border2);color:var(--text);font-family:var(--sans);font-size:13px;font-weight:600;padding:7px 14px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px}
.refresh-btn.spinning svg{animation:spin 0.8s linear infinite}
.last-update{font-family:var(--mono);font-size:11px;color:var(--muted)}
.main{padding:16px 16px calc(var(--safe-bottom) + 60px);max-width:480px;margin:0 auto}
.tab-bar{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:16px}
.tab{flex:1;padding:9px 12px;border-radius:9px;font-size:13px;font-weight:600;text-align:center;cursor:pointer;color:var(--muted2)}
.tab.active{background:var(--surface3);color:var(--text);border:1px solid var(--border2)}
.summary-bar{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:16px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.summary-item{display:flex;align-items:center;gap:6px;flex-shrink:0}
.summary-dot{width:8px;height:8px;border-radius:50%}
.summary-dot.pump{background:var(--pump)}.summary-dot.dump{background:var(--dump)}.summary-dot.neutral{background:var(--neutral)}
.summary-num{font-family:var(--mono);font-size:15px;font-weight:700}
.summary-txt{font-size:11px;color:var(--muted2);text-transform:uppercase;letter-spacing:0.06em}
.summary-divider{width:1px;height:24px;background:var(--border);flex-shrink:0}
.filter-row{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.chip{flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--muted2)}
.chip.active{background:var(--surface3);color:var(--text);border-color:var(--border2)}
.chip.pump.active{background:rgba(0,229,160,0.1);color:var(--pump);border-color:rgba(0,229,160,0.25)}
.chip.dump.active{background:rgba(255,77,109,0.1);color:var(--dump);border-color:rgba(255,77,109,0.25)}
.coin-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:10px;position:relative;overflow:hidden}
.coin-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.coin-card.pump::before{background:var(--pump)}.coin-card.dump::before{background:var(--dump)}.coin-card.neutral::before{background:var(--neutral)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.coin-symbol{font-size:20px;font-weight:800;letter-spacing:-0.02em;line-height:1;margin-bottom:3px}
.coin-label{font-size:11px;color:var(--muted);font-family:var(--mono)}
.verdict-pill{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;border:1px solid transparent;flex-shrink:0}
.verdict-pill.pump{background:rgba(0,229,160,0.1);color:var(--pump);border-color:rgba(0,229,160,0.2)}
.verdict-pill.dump{background:rgba(255,77,109,0.1);color:var(--dump);border-color:rgba(255,77,109,0.2)}
.verdict-pill.neutral{background:rgba(245,197,66,0.1);color:var(--neutral);border-color:rgba(245,197,66,0.2)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.metric{background:var(--surface2);border-radius:10px;padding:8px 10px}
.metric-label{font-size:10px;color:var(--muted);font-family:var(--mono);margin-bottom:3px}
.metric-value{font-size:14px;font-weight:700;font-family:var(--mono);line-height:1}
.metric-value.up{color:var(--pump)}.metric-value.down{color:var(--dump)}.metric-value.def{color:var(--text)}
.signals{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.signal-row{display:flex;align-items:center;gap:8px}
.signal-label{font-size:11px;color:var(--muted2);width:80px;flex-shrink:0;font-family:var(--mono)}
.bar-track{flex:1;height:4px;background:var(--surface3);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px}
.bar-val{font-size:11px;font-family:var(--mono);width:32px;text-align:right;color:var(--muted2)}
.conf-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.conf-lbl{font-size:11px;color:var(--muted);font-family:var(--mono)}
.conf-val{font-size:13px;font-weight:700;font-family:var(--mono)}
.ai-section{margin-top:12px;border-top:1px solid var(--border);padding-top:12px}
.ai-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.ai-label{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted2);font-family:var(--mono)}
.ai-prob{font-size:13px;font-weight:700;font-family:var(--mono)}
.ai-body{font-size:12px;color:var(--muted2);line-height:1.6;background:var(--surface3);border-radius:10px;padding:10px 12px}
.ai-score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;margin-bottom:10px}
.ai-score{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:10px;padding:8px 9px}
.ai-score-lbl{font-size:9px;color:var(--muted);font-family:var(--mono);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:4px}
.ai-score-val{font-size:15px;font-weight:700;font-family:var(--mono);line-height:1}
.ai-score-sub{font-size:10px;color:var(--muted2);font-family:var(--mono);margin-top:4px}
.ai-mini-bar{height:4px;background:rgba(255,255,255,0.05);border-radius:4px;overflow:hidden;margin-top:7px}
.ai-mini-fill{height:100%;border-radius:4px}
.ai-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ai-meta-pill{font-size:10px;font-family:var(--mono);padding:3px 8px;border-radius:20px;background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--muted2)}
.ai-loading{font-size:12px;color:var(--muted);font-family:var(--mono);font-style:italic;padding:8px 0;display:flex;align-items:center;gap:8px}
.ai-spinner{width:12px;height:12px;border:1.5px solid var(--border2);border-top-color:var(--accent2);border-radius:50%;animation:spin 0.8s linear infinite;flex-shrink:0}
.signal-flags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.flag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;font-family:var(--mono);letter-spacing:0.04em}
.flag.bull{background:rgba(0,229,160,0.12);color:var(--pump);border:1px solid rgba(0,229,160,0.2)}
.flag.bear{background:rgba(255,77,109,0.12);color:var(--dump);border:1px solid rgba(255,77,109,0.2)}
.flag.warn{background:rgba(245,197,66,0.12);color:var(--neutral);border:1px solid rgba(245,197,66,0.2)}
.flag.info{background:rgba(167,139,250,0.12);color:var(--accent2);border:1px solid rgba(167,139,250,0.2)}
.prob-bar{height:6px;background:var(--surface3);border-radius:4px;overflow:hidden;margin-top:6px;margin-bottom:4px}
.prob-fill{height:100%;border-radius:4px;transition:width 1s ease}
.prob-labels{display:flex;justify-content:space-between;font-size:10px;font-family:var(--mono);color:var(--muted)}
.upcoming-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.upc-left{flex:1;min-width:0}
.upc-sym{font-size:18px;font-weight:800;letter-spacing:-0.02em;margin-bottom:3px;display:flex;align-items:center;gap:8px}
.new-badge{font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;background:rgba(123,111,255,0.15);color:var(--accent2);border:1px solid rgba(123,111,255,0.25);padding:2px 7px;border-radius:20px}
.upc-desc{font-size:12px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upc-time{text-align:right;flex-shrink:0}
.time-val{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--accent2);white-space:nowrap}
.time-lbl{font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.loading-row{display:flex;align-items:center;gap:10px;padding:40px 0;color:var(--muted2);font-size:13px;font-family:var(--mono);justify-content:center}
.spinner{width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--accent2);border-radius:50%;animation:spin 0.8s linear infinite}
.err{background:rgba(255,77,109,0.07);border:1px solid rgba(255,77,109,0.2);border-radius:12px;padding:14px 16px;font-size:13px;color:var(--dump);font-family:var(--mono);line-height:1.6}
.inf{background:rgba(123,111,255,0.07);border:1px solid rgba(123,111,255,0.2);border-radius:12px;padding:14px 16px;font-size:13px;color:var(--accent2);font-family:var(--mono);line-height:1.6}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px;font-family:var(--mono)}
</style>
</head>

<div class="main" id="app"><div class="loading-row"><div class="spinner"></div>Initialising...</div></div>
<script type="text/javascript">
var PX='https://binance-proxy.radu-c-codreanu.workers.dev',ND=30;
var S={tab:'new',f:'all',nc:[],up:[],ln:false,lu:false,en:null,eu:null};
var aiCache={};

function pF(p){return fetch(PX+p,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()});}
function fK(s){return pF('/fapi/v1/klines?symbol='+s+'&interval=1h&limit=48').catch(function(){return[];});}
function fOI(s){return pF('/fapi/v1/openInterest?symbol='+s).then(function(d){return parseFloat(d.openInterest)||0;}).catch(function(){return 0;});}
function fFR(s){return pF('/fapi/v1/fundingRate?symbol='+s+'&limit=3').then(function(d){return d&&d.length?parseFloat(d[d.length-1].fundingRate)*100:0;}).catch(function(){return 0;});}
function fSpot(s){return fetch('https://api.binance.com/api/v3/ticker/24hr?symbol='+s+'USDT').then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});}

function fUp(){return pF('/bapi/composite/v1/public/cms/article/list/query?type=1&pageNo=1&pageSize=20&catalogId=48').then(function(d){var art=d&&d.data&&d.data.articles?d.data.articles:[];var res=[];for(var i=0;i<art.length;i++){var a=art[i];var t=a.title||'';var sm=(t.match(/([A-Z]{2,10})USDT/g)||[]).filter(function(v,i,arr){return arr.indexOf(v)===i;});var dm=t.match(/(\d{4}-\d{2}-\d{2})/);var ld=dm?new Date(dm[1]).getTime():null;for(var j=0;j<sm.length;j++){var b=sm[j].replace('USDT','');res.push({symbol:b+'/USDT',base:b,title:t.length>80?t.slice(0,77)+'...':t,listDate:ld,ad:a.releaseDate||Date.now()});}}var seen={};for(var k=0;k<res.length;k++){var rx=res[k];if(!seen[rx.base]||rx.ad>seen[rx.base].ad)seen[rx.base]=rx;}var out=[];for(var key in seen)out.push(seen[key]);return out.slice(0,10);});}

function az(o){var chg=parseFloat(o.priceChangePercent)||0,vol=parseFloat(o.quoteVolume)||0,tc=parseInt(o.count)||0;var mom=Math.min(100,Math.max(0,50+chg*2)),volS=Math.min(100,(vol/5e6)*40+30),act=Math.min(100,(tc/5e4)*100);var tr=50;var kl=o.klines||[];if(kl.length>=6){var cl=kl.slice(-12).map(function(k){return parseFloat(k[4]);});var n=cl.length,xm=(n-1)/2,ym=cl.reduce(function(a,b){return a+b;},0)/n;var nu=0,de=0;cl.forEach(function(y,x){nu+=(x-xm)*(y-ym);de+=(x-xm)*(x-xm);});var sl=de?nu/de:0;tr=Math.min(100,Math.max(0,50+(ym?(sl/ym)*100:0)*20));}var oiS=Math.min(100,o.oi>0?Math.log(o.oi+1)/Math.LN10*20:40);var ag=(Date.now()-o.openTime)/864e5,fr=ag<3?70:ag<7?62:ag<14?54:42;var sc=Math.round(mom*.3+volS*.2+tr*.2+act*.1+oiS*.1+fr*.1);var vd=sc>=62?'pump':sc<=42?'dump':'neutral';return{mom:mom,vol:volS,act:act,tr:tr,sc:sc,vd:vd,cf:Math.max(10,Math.min(98,Math.round(Math.abs(sc-50)*2)))};}

function buildFlags(coin){
  var flags=[];
  var t=coin.t,a=coin.a,spot=coin.spot,fr=parseFloat(coin.fr||0);
  var chg=parseFloat(t.priceChangePercent||0);
  var vol=parseFloat(t.quoteVolume||0);
  var ageDays=Math.max(0,Math.round((Date.now()-coin.ot)/864e5));
  var profile=getListingProfile(ageDays);
  var pulse=getCandlePulse(coin);
  var oiPulse=getOiPulse(coin);

  flags.push({type:'info',text:profile.label});

  if(spot){
    flags.push({type:'info',text:'SPOT LISTED'});
    var spotChg=parseFloat(spot.priceChangePercent||0);
    if(spotChg>4&&spotChg<18)flags.push({type:'bull',text:'SPOT CONFIRMS'});
    if(spotChg>18)flags.push({type:'warn',text:'SPOT STRETCHED'});
    if(spotChg<-4)flags.push({type:'bear',text:'SPOT NOT CONFIRMING'});
  }else{flags.push({type:'warn',text:'NO SPOT PAIR'});}

  if(chg>=14)flags.push({type:'warn',text:'VERTICAL DAY'});
  else if(chg>=5)flags.push({type:'bull',text:'DAY-2 FOLLOW THROUGH'});
  else if(chg<=-8)flags.push({type:'bear',text:'HEAVY SELL PRESSURE'});

  if(vol>60e6)flags.push({type:'bull',text:'HEAVY TURNOVER'});
  else if(vol<3e6)flags.push({type:'bear',text:'THIN TURNOVER'});

  if(pulse.rangeExpansion>1.35)flags.push({type:'bull',text:'RANGE EXPANDING'});
  if(pulse.rangeCompression<0.75)flags.push({type:'warn',text:'RANGE TIGHTENING'});
  if(pulse.closePosition>0.72)flags.push({type:'bull',text:'HOURLY CLOSES NEAR HIGHS'});
  if(pulse.closePosition<0.34)flags.push({type:'bear',text:'HOURLY CLOSES WEAK'});

  if(oiPulse>10)flags.push({type:'bull',text:'OI BUILDING'});
  if(oiPulse<-10)flags.push({type:'warn',text:'OI FLUSHING'});

  if(fr>0.05)flags.push({type:'warn',text:'FUNDING +'+fr.toFixed(3)+'%'});
  else if(fr<-0.02)flags.push({type:'bull',text:'NEG FUNDING'});

  if(a.tr>70)flags.push({type:'bull',text:'UPTREND'});
  if(a.tr<35)flags.push({type:'bear',text:'DOWNTREND'});
  if(a.mom>78)flags.push({type:'warn',text:'LONGS CROWDED'});

  return flags;
}

function aiClamp(v,min,max){return Math.max(min,Math.min(max,v));}
function aiFmtPct(v){var n=parseFloat(v||0);return (n>0?'+':'')+n.toFixed(2)+'%';}
function aiVolTrend(coin){
  var kl=coin.kl||[];
  if(kl.length<12)return 'unknown';
  var earlyVol=0,lateVol=0;
  for(var i=0;i<6;i++)earlyVol+=parseFloat(kl[i][5]||0);
  for(var j=kl.length-6;j<kl.length;j++)lateVol+=parseFloat(kl[j][5]||0);
  return lateVol>earlyVol*1.3?'increasing':lateVol<earlyVol*0.7?'decreasing':'flat';
}
function getListingProfile(ageDays){
  if(ageDays<=2)return{phase:'discovery',label:'DISCOVERY WINDOW',boost:9,risk:7};
  if(ageDays<=4)return{phase:'price-discovery',label:'PRICE DISCOVERY',boost:12,risk:11};
  if(ageDays<=7)return{phase:'decision-zone',label:'DAY 3-7 DECISION',boost:10,risk:15};
  if(ageDays<=14)return{phase:'post-hype',label:'POST-HYPE CHECK',boost:2,risk:18};
  return{phase:'mature',label:'LATE LISTING',boost:-4,risk:14};
}
function getCandlePulse(coin){
  var kl=coin.kl||[];
  var out={bodyBias:0,closePosition:0.5,rangeExpansion:1,rangeCompression:1,greenShare:0};
  if(kl.length<8)return out;
  var recent=kl.slice(-6),older=kl.slice(-12,-6),green=0,bodySum=0,rangeSum=0,olderRange=0,closePos=0;
  for(var i=0;i<recent.length;i++){
    var o=parseFloat(recent[i][1]||0),h=parseFloat(recent[i][2]||0),l=parseFloat(recent[i][3]||0),c=parseFloat(recent[i][4]||0);
    var range=Math.max(h-l,1e-9);
    if(c>o)green++;
    bodySum+=((c-o)/range)*100;
    rangeSum+=range;
    closePos+=(c-l)/range;
  }
  for(var j=0;j<older.length;j++)olderRange+=Math.max(parseFloat(older[j][2]||0)-parseFloat(older[j][3]||0),1e-9);
  out.bodyBias=bodySum/recent.length;
  out.closePosition=closePos/recent.length;
  out.greenShare=green/recent.length;
  out.rangeExpansion=olderRange>0?(rangeSum/recent.length)/(olderRange/older.length):1;
  out.rangeCompression=out.rangeExpansion;
  return out;
}
function getOiPulse(coin){
  var oi=parseFloat(coin.oi||0),vol=parseFloat((coin.t&&coin.t.quoteVolume)||0);
  if(!oi||!vol)return 0;
  return aiClamp(((Math.log(oi+1)/Math.LN10)*18)+((vol>0?Math.log(vol+1)/Math.LN10:0)*3)-55,-25,25);
}
function addUnique(list,text){if(text&&list.indexOf(text)===-1)list.push(text);}
function scoreLabel(v,mode){
  if(mode==='risk')return v>=72?'HIGH':v>=55?'ELEVATED':v>=40?'MED':'LOW';
  return v>=70?'STRONG':v>=55?'LEAN':v>=40?'MIXED':'WEAK';
}
function buildLocalAnalysis(coin){
  var t=coin.t,a=coin.a,spot=coin.spot;
  var ageDays=Math.max(0,Math.round((Date.now()-coin.ot)/864e5));
  var chg=parseFloat(t.priceChangePercent||0);
  var fr=parseFloat(coin.fr||0);
  var vol=parseFloat(t.quoteVolume||0);
  var volTrend=aiVolTrend(coin);
  var profile=getListingProfile(ageDays);
  var pulse=getCandlePulse(coin);
  var oiPulse=getOiPulse(coin);
  var continuation=48+profile.boost;
  var distribution=22+profile.risk;
  var squeeze=26;
  var bullReasons=[];
  var bearReasons=[];
  var riskReasons=[];
  var spotChg=spot?parseFloat(spot.priceChangePercent||0):null;

  if(a.tr>68){continuation+=14;addUnique(bullReasons,'trend is still lifting instead of rolling over');}
  else if(a.tr<38){distribution+=16;addUnique(bearReasons,'trend already looks broken');}

  if(a.mom>74&&chg>0){continuation+=11;distribution+=4;addUnique(bullReasons,'momentum is still printing follow-through');}
  else if(a.mom<40||chg<-4){distribution+=12;continuation-=8;addUnique(bearReasons,'momentum is fading fast');}

  if(volTrend==='increasing'){continuation+=8;squeeze+=5;addUnique(bullReasons,'volume is expanding into the move');}
  else if(volTrend==='decreasing'){distribution+=10;continuation-=6;addUnique(riskReasons,'volume is drying up');}

  if(vol>6e7){continuation+=7;squeeze+=4;addUnique(bullReasons,'turnover is strong enough for another leg');}
  else if(vol<3e6){distribution+=11;continuation-=7;addUnique(riskReasons,'liquidity is thin for a fresh listing');}

  if(ageDays<=2){continuation+=8;squeeze+=9;addUnique(bullReasons,'it is still inside the first discovery burst');}
  else if(ageDays<=4){continuation+=10;distribution+=6;squeeze+=7;addUnique(bullReasons,'day 2-4 listings often trend hardest if they hold');}
  else if(ageDays<=7){continuation+=5;distribution+=12;squeeze+=3;addUnique(riskReasons,'day 3-7 is where real distribution often starts');}
  else if(ageDays>10){distribution+=8;continuation-=4;addUnique(bearReasons,'the easy listing impulse is mostly gone');}

  if(pulse.closePosition>0.72){continuation+=8;addUnique(bullReasons,'recent candles are closing near their highs');}
  else if(pulse.closePosition<0.36){distribution+=10;continuation-=5;addUnique(bearReasons,'recent candles keep closing weak');}

  if(pulse.greenShare>=0.66&&pulse.bodyBias>12){continuation+=7;squeeze+=4;addUnique(bullReasons,'buyers are controlling the hourly tape');}
  if(pulse.rangeExpansion>1.3&&chg>0){continuation+=4;distribution+=6;addUnique(riskReasons,'range is expanding, so upside can continue but failure gets violent');}
  if(pulse.rangeExpansion<0.82){distribution+=5;addUnique(riskReasons,'range is compressing after the initial burst');}

  if(spot){
    if(spotChg>4&&spotChg<18){continuation+=8;addUnique(bullReasons,'spot demand is confirming the perp');}
    else if(spotChg>=18){distribution+=10;continuation-=3;addUnique(riskReasons,'spot already looks stretched');}
    else if(spotChg<=-4){distribution+=11;continuation-=8;addUnique(bearReasons,'spot is not backing the futures move');}
  }else{
    distribution+=6;continuation-=3;addUnique(riskReasons,'there is no spot pair to confirm real demand');
  }

  if(fr>0.08){distribution+=16;squeeze-=6;continuation-=8;addUnique(riskReasons,'funding is too hot and longs look crowded');}
  else if(fr>0.04){distribution+=9;continuation-=4;addUnique(riskReasons,'funding is getting crowded');}
  else if(fr<-0.025){squeeze+=16;continuation+=5;addUnique(bullReasons,'negative funding leaves room for a squeeze');}

  if(oiPulse>8&&chg>0){continuation+=6;distribution+=3;squeeze+=7;addUnique(bullReasons,'open interest is building with price');}
  else if(oiPulse<-8){distribution+=9;squeeze-=4;addUnique(riskReasons,'open interest is already flushing out');}

  if(chg>=18){distribution+=13;continuation-=2;squeeze+=5;addUnique(riskReasons,'the daily move is already very extended');}
  else if(chg<=-10){distribution+=14;continuation-=10;squeeze+=6;addUnique(bearReasons,'the market is already accepting lower prices');}

  continuation=aiClamp(Math.round(continuation),8,96);
  distribution=aiClamp(Math.round(distribution),6,95);
  squeeze=aiClamp(Math.round(squeeze),5,95);

  var net=continuation-distribution;
  var verdict='neutral';
  if(net>=12&&continuation>=58)verdict='pump';
  else if(net<=-10||distribution>=68)verdict='dump';

  var reasoning='';
  if(verdict==='pump')reasoning='Opinionated read: continuation still has the edge. '+(bullReasons.slice(0,3).join(', ')||'The tape is still constructive')+'.';
  else if(verdict==='dump')reasoning='Opinionated read: this looks more like distribution than healthy continuation. '+(bearReasons.slice(0,3).join(', ')||riskReasons.slice(0,2).join(', ')||'The tape is losing quality')+'.';
  else reasoning='Opinionated read: this is in a decision zone, not a clean chase. '+((bullReasons[0]||'there is still some demand')+' but '+(riskReasons[0]||bearReasons[0]||'distribution risk is no longer trivial'))+'.';

  if(ageDays>=3&&ageDays<=7)reasoning+=' That day 3-7 window matters most here: if it cannot hold strength now, it usually turns into chop or distribution rather than a second clean leg.';
  else if(ageDays<=2)reasoning+=' Very fresh listings can stay irrational longer, so squeezes and trend extensions both hit harder in the first 48h.';

  var bullCase='If dips stay shallow, spot keeps confirming, and funding does not overheat, this can still print another continuation leg.';
  var bearCase='If range expansion stops producing higher closes, the same fast money that pushed it up usually turns into distribution just as quickly.';
  var tradeAngle='Prefer reacting to structure: buy controlled pullbacks or tight bases when continuation wins, and fade failed reclaims when distribution starts taking over.';

  if(verdict==='dump'){
    bullCase='A sharp reclaim with improving closes and better spot confirmation would be the only clean way to invalidate the bearish read.';
    bearCase='Weak bounces inside day 3-7 often become distribution traps, especially when funding stays warm and volume fades.';
    tradeAngle='Do not short the hole blindly; wait for a failed bounce or a clearly weak reclaim, because fresh listings still squeeze hard.';
  } else if(verdict==='neutral'){
    bullCase='A cleaner base plus strong closes near the highs would push this back into continuation mode.';
    bearCase='One more weak rejection with fading turnover likely shifts it from watchlist material into active distribution.';
    tradeAngle='This is a wait-for-proof setup. The clean trade is after confirmation, not before.';
  }

  return {
    verdict:verdict,
    continuation_probability:continuation,
    continuation_score:continuation,
    distribution_score:distribution,
    squeeze_risk_score:squeeze,
    listing_phase:profile.label,
    age_days:ageDays,
    reasoning:reasoning,
    bull_case:bullCase,
    bear_case:bearCase,
    trade_angle:tradeAngle,
    source:'local-model'
  };
}

function getAIAnalysis(coin){
  var sym=coin.sym;
  if(aiCache[sym])return Promise.resolve(aiCache[sym]);
  var analysis=buildLocalAnalysis(coin);
  aiCache[sym]=analysis;
  return Promise.resolve(analysis);
}

function lNL(){S.ln=true;S.en=null;rd();return Promise.all([pF('/fapi/v1/exchangeInfo'),pF('/fapi/v1/ticker/24hr')]).then(function(res){var ex=res[0],tk=res[1];var ob={};(ex.symbols||[]).forEach(function(s){if(s.quoteAsset==='USDT'&&s.contractType==='PERPETUAL'&&s.status==='TRADING')ob[s.symbol]=s.onboardDate;});var tm={};tk.forEach(function(t){tm[t.symbol]=t;});var cu=Date.now()-ND*864e5;var ns=Object.entries(ob).filter(function(e){return e[1]>=cu;}).sort(function(a,b){return b[1]-a[1];}).slice(0,14).map(function(e){return{sym:e[0],ot:e[1]};});return Promise.all(ns.map(function(n){var t=tm[n.sym]||{};var base=n.sym.replace('USDT','');return Promise.all([fK(n.sym),fOI(n.sym),fFR(n.sym),fSpot(base)]).then(function(r){var a=az(Object.assign({},t,{klines:r[0],oi:r[1],openTime:n.ot}));return{sym:n.sym,ot:n.ot,t:t,kl:r[0],oi:r[1],fr:r[2],spot:r[3],a:a,aiData:null,aiLoading:false};});}));}).then(function(en){S.nc=en.sort(function(a,b){return b.a.sc-a.a.sc;});}).catch(function(e){S.en=e.message;}).then(function(){S.ln=false;rd();loadAIForAll();});}

function loadAIForAll(){
  S.nc.forEach(function(coin,idx){
    coin.aiLoading=true;
    rd();
    setTimeout(function(){
      getAIAnalysis(coin).then(function(ai){
        coin.aiData=ai;
        coin.aiLoading=false;
        rd();
      });
    },idx*800);
  });
}

function lUp(){S.lu=true;S.eu=null;rd();return fUp().then(function(u){S.up=u;}).catch(function(e){S.eu=e.message;}).then(function(){S.lu=false;rd();});}
function loadAll(){var b=document.getElementById('rb');if(b)b.classList.add('spinning');aiCache={};return Promise.all([lNL(),lUp()]).then(function(){var el=document.getElementById('lu');if(el)el.textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});var b2=document.getElementById('rb');if(b2)b2.classList.remove('spinning');});}

function fp(n){var v=parseFloat(n);if(!v)return'--';if(v>=1000)return'$'+v.toLocaleString('en',{maximumFractionDigits:0});if(v>=1)return'$'+v.toFixed(3);return'$'+v.toPrecision(4);}
function fv(n){var v=parseFloat(n);if(!v)return'--';if(v>=1e9)return'$'+(v/1e9).toFixed(1)+'B';if(v>=1e6)return'$'+(v/1e6).toFixed(0)+'M';if(v>=1e3)return'$'+(v/1e3).toFixed(0)+'K';return'$'+v.toFixed(0);}
function vc(v){return v==='pump'?'var(--pump)':v==='dump'?'var(--dump)':'var(--neutral)';}
function sb(v,c){var p=Math.round(v);return '<div class="bar-track"><div class="bar-fill" style="width:'+p+'%;background:'+c+'"></div></div><span class="bar-val">'+p+'</span>';}

function renderFlags(flags){
  var h='<div class="signal-flags">';
  for(var i=0;i<flags.length;i++){h+='<span class="flag '+flags[i].type+'">'+flags[i].text+'</span>';}
  return h+'</div>';
}

function renderAIScore(label,val,color,mode){
  var v=Math.round(val||0);
  return '<div class="ai-score"><div class="ai-score-lbl">'+label+'</div><div class="ai-score-val" style="color:'+color+'">'+v+'</div><div class="ai-score-sub">'+scoreLabel(v,mode)+'</div><div class="ai-mini-bar"><div class="ai-mini-fill" style="width:'+v+'%;background:'+color+'"></div></div></div>';
}
function renderAI(coin){
  if(coin.aiLoading)return '<div class="ai-section"><div class="ai-loading"><div class="ai-spinner"></div>Running local analyst...</div></div>';
  if(!coin.aiData)return '';
  var ai=coin.aiData;
  var prob=ai.continuation_probability||50;
  var vd=ai.verdict||coin.a.vd;
  var probColor=prob>=65?'var(--pump)':prob<=40?'var(--dump)':'var(--neutral)';
  var distColor=(ai.distribution_score||0)>=65?'var(--dump)':'var(--neutral)';
  var sqColor=(ai.squeeze_risk_score||0)>=65?'var(--accent2)':(ai.squeeze_risk_score||0)>=45?'var(--neutral)':'var(--pump)';
  var h='<div class="ai-section">';
  h+='<div class="ai-header"><span class="ai-label">Scout Analysis</span><span class="ai-prob" style="color:'+probColor+'">'+prob+'/100 continuation</span></div>';
  h+='<div class="prob-bar"><div class="prob-fill" style="width:'+prob+'%;background:'+probColor+'"></div></div>';
  h+='<div class="prob-labels"><span>DISTRIBUTION</span><span>WATCH</span><span>CONTINUE</span></div>';
  h+='<div class="ai-body" style="margin-top:10px">';
  h+='<div style="margin-bottom:8px;color:var(--text);font-style:normal">'+ai.reasoning+'</div>';
  h+='<div class="ai-score-grid">';
  h+=renderAIScore('continue',ai.continuation_score||prob,probColor,'score');
  h+=renderAIScore('distribution',ai.distribution_score||50,distColor,'risk');
  h+=renderAIScore('squeeze risk',ai.squeeze_risk_score||50,sqColor,'risk');
  h+='</div>';
  h+='<div class="ai-meta"><span class="ai-meta-pill">'+(ai.listing_phase||'LISTING')+'</span><span class="ai-meta-pill">'+(ai.age_days||0)+'D OLD</span><span class="ai-meta-pill">'+(vd==='pump'?'LEAN LONG':vd==='dump'?'LEAN SHORT':'WAIT/PROVE')+'</span></div>';
  if(ai.bull_case)h+='<div style="color:var(--pump);margin-top:10px;margin-bottom:4px">&#9650; '+ai.bull_case+'</div>';
  if(ai.bear_case)h+='<div style="color:var(--dump);margin-bottom:4px">&#9660; '+ai.bear_case+'</div>';
  if(ai.trade_angle)h+='<div style="color:var(--accent2);margin-top:6px;font-style:normal;border-top:1px solid var(--border);padding-top:6px">&#9658; '+ai.trade_angle+'</div>';
  h+='</div></div>';
  return h;
}

function gVerdict(coin){return coin.aiData&&coin.aiData.verdict?coin.aiData.verdict:coin.a.vd;}

function rCC(coin){
  var sym=coin.sym,t=coin.t,a=coin.a,ot=coin.ot;
  var vd=gVerdict(coin),cf=a.cf,sc=a.sc,mom=a.mom,vol=a.vol,tr=a.tr,act=a.act;
  var sh=sym.replace('USDT',''),chg=parseFloat(t.priceChangePercent||0);
  var cc=chg>0?'up':chg<0?'down':'def',cs=(chg>0?'+':'')+chg.toFixed(2)+'%';
  var ag=Math.round((Date.now()-ot)/864e5),col=vc(vd);
  var ic=vd==='pump'?'&#9650;':vd==='dump'?'&#9660;':'&#9670;';
  var lb=vd==='pump'?'PUMP':vd==='dump'?'DUMP':'WATCH';
  var fr=typeof coin.fr==='number'?coin.fr.toFixed(4)+'%':'--';
  var flags=buildFlags(coin);

  var h='<div class="coin-card '+vd+'">';
  h+='<div class="card-top"><div><div class="coin-symbol">'+sh+'</div><div class="coin-label">USDT PERP &middot; '+ag+'d ago</div></div><div class="verdict-pill '+vd+'">'+ic+' '+lb+'</div></div>';
  h+=renderFlags(flags);
  h+='<div class="metrics">';
  h+='<div class="metric"><div class="metric-label">PRICE</div><div class="metric-value def">'+fp(t.lastPrice)+'</div></div>';
  h+='<div class="metric"><div class="metric-label">24H CHG</div><div class="metric-value '+cc+'">'+cs+'</div></div>';
  h+='<div class="metric"><div class="metric-label">FUNDING</div><div class="metric-value '+(parseFloat(coin.fr||0)>0.05?'down':parseFloat(coin.fr||0)<0?'up':'def')+'">'+fr+'</div></div>';
  h+='<div class="metric"><div class="metric-label">VOL 24H</div><div class="metric-value def">'+fv(t.quoteVolume)+'</div></div>';
  h+='<div class="metric"><div class="metric-label">SPOT</div><div class="metric-value '+(coin.spot?'up':'def')+'">'+(coin.spot?fp(coin.spot.lastPrice):'--')+'</div></div>';
  h+='<div class="metric"><div class="metric-label">SCORE</div><div class="metric-value" style="color:'+col+'">'+sc+'/100</div></div>';
  h+='</div>';
  h+='<div class="signals">';
  h+='<div class="signal-row"><span class="signal-label">momentum</span>'+sb(mom,col)+'</div>';
  h+='<div class="signal-row"><span class="signal-label">volume</span>'+sb(vol,col)+'</div>';
  h+='<div class="signal-row"><span class="signal-label">trend</span>'+sb(tr,col)+'</div>';
  h+='<div class="signal-row"><span class="signal-label">activity</span>'+sb(act,col)+'</div>';
  h+='</div>';
  h+=renderAI(coin);
  h+='</div>';
  return h;
}

function rUC(item){var now=Date.now(),diff=item.listDate?item.listDate-now:null,ts,tl;if(diff===null){ts='TBA';tl='unconfirmed';}else if(diff<0){ts='Listed';tl='recently';}else if(diff<36e5){ts=Math.floor(diff/6e4)+'m';tl='until listing';}else if(diff<864e5){ts=Math.floor(diff/36e5)+'h '+Math.floor((diff%36e5)/6e4)+'m';tl='until listing';}else{ts=Math.ceil(diff/864e5)+'d';tl='until listing';}return '<div class="upcoming-card"><div class="upc-left"><div class="upc-sym">'+item.symbol+' <span class="new-badge">NEW</span></div><div class="upc-desc">'+item.title+'</div></div><div class="upc-time"><div class="time-val">'+ts+'</div><div class="time-lbl">'+tl+'</div></div></div>';}

function rd(){var app=document.getElementById('app');if(!app)return;var fl=S.f==='all'?S.nc:S.nc.filter(function(c){return gVerdict(c)===S.f;});var pu=S.nc.filter(function(c){return gVerdict(c)==='pump';}).length,du=S.nc.filter(function(c){return gVerdict(c)==='dump';}).length,ne=S.nc.filter(function(c){return gVerdict(c)==='neutral';}).length;var h='<div class="tab-bar"><div class="tab '+(S.tab==='new'?'active':'')+'" onclick="st(&apos;new&apos;)">New Listings</div><div class="tab '+(S.tab==='upcoming'?'active':'')+'" onclick="st(&apos;upcoming&apos;)">Upcoming</div></div>';if(S.tab==='new'){if(!S.ln&&S.nc.length>0){h+='<div class="summary-bar"><div class="summary-item"><div class="summary-dot pump"></div><span class="summary-num" style="color:var(--pump)">'+pu+'</span><span class="summary-txt">pump</span></div><div class="summary-divider"></div><div class="summary-item"><div class="summary-dot dump"></div><span class="summary-num" style="color:var(--dump)">'+du+'</span><span class="summary-txt">dump</span></div><div class="summary-divider"></div><div class="summary-item"><div class="summary-dot neutral"></div><span class="summary-num" style="color:var(--neutral)">'+ne+'</span><span class="summary-txt">watch</span></div><div class="summary-divider"></div><div class="summary-item"><span class="summary-num">'+S.nc.length+'</span><span class="summary-txt">total</span></div></div><div class="filter-row"><div class="chip '+(S.f==='all'?'active':'')+'" onclick="sf(&apos;all&apos;)">All</div><div class="chip pump '+(S.f==='pump'?'active':'')+'" onclick="sf(&apos;pump&apos;)">&#9650; Pump</div><div class="chip dump '+(S.f==='dump'?'active':'')+'" onclick="sf(&apos;dump&apos;)">&#9660; Dump</div><div class="chip neutral '+(S.f==='neutral'?'active':'')+'" onclick="sf(&apos;neutral&apos;)">&#9670; Watch</div></div>';}if(S.ln){h+='<div class="loading-row"><div class="spinner"></div>Scanning...</div>';}else if(S.en){h+='<div class="err">Error: '+S.en+'</div>';}else if(fl.length===0){h+='<div class="empty">No coins match.</div>';}else{for(var i=0;i<fl.length;i++)h+=rCC(fl[i]);}}else{if(S.lu){h+='<div class="loading-row"><div class="spinner"></div>Fetching...</div>';}else if(S.eu){h+='<div class="err">Error: '+S.eu+'</div>';}else if(S.up.length===0){h+='<div class="inf">No upcoming listings found.</div>';}else{for(var i=0;i<S.up.length;i++)h+=rUC(S.up[i]);}}app.innerHTML=h;}
function st(t){S.tab=t;rd();}
function sf(f){S.f=f;rd();}
loadAll();
</script>
