<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Listing Scout">
<title>Listing Scout</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--surface:#111118;--surface2:#18181f;--surface3:#20202a;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);--text:#f0f0f5;--muted:#6b6b80;--muted2:#9090a8;--pump:#00e5a0;--dump:#ff4d6d;--neutral:#f5c542;--accent2:#a78bfa;--mono:'Space Mono',monospace;--sans:'Syne',sans-serif;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden}
.topbar{position:sticky;top:0;z-index:100;background:rgba(10,10,15,0.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:calc(var(--safe-top) + 12px) 16px 12px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:17px;font-weight:800;letter-spacing:-0.02em;display:flex;align-items:center;gap:8px}
.logo-dot{width:8px;height:8px;border-radius:50%;background:var(--pump);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(0.85)}}
@keyframes spin{to{transform:rotate(360deg)}}
.refresh-btn{background:var(--surface2);border:1px solid var(--border2);color:var(--text);font-family:var(--sans);font-size:13px;font-weight:600;padding:7px 14px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px}
.refresh-btn.spinning svg{animation:spin 0.8s linear infinite}
.last-update{font-family:var(--mono);font-size:11px;color:var(--muted)}
.main{padding:16px 16px calc(var(--safe-bottom) + 60px);max-width:480px;margin:0 auto}
.tab-bar{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:16px}
.tab{flex:1;padding:9px 12px;border-radius:9px;font-size:13px;font-weight:600;text-align:center;cursor:pointer;color:var(--muted2)}
.tab.active{background:var(--surface3);color:var(--text);border:1px solid var(--border2)}
.summary-bar{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:16px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.summary-item{display:flex;align-items:center;gap:6px;flex-shrink:0}
.summary-dot{width:8px;height:8px;border-radius:50%}
.summary-dot.pump{background:var(--pump)}.summary-dot.dump{background:var(--dump)}.summary-dot.neutral{background:var(--neutral)}
.summary-num{font-family:var(--mono);font-size:15px;font-weight:700}
.summary-txt{font-size:11px;color:var(--muted2);text-transform:uppercase;letter-spacing:0.06em}
.summary-divider{width:1px;height:24px;background:var(--border);flex-shrink:0}
.filter-row{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.chip{flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--muted2)}
.chip.active{background:var(--surface3);color:var(--text);border-color:var(--border2)}
.chip.pump.active{background:rgba(0,229,160,0.1);color:var(--pump);border-color:rgba(0,229,160,0.25)}
.chip.dump.active{background:rgba(255,77,109,0.1);color:var(--dump);border-color:rgba(255,77,109,0.25)}
.coin-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:10px;position:relative;overflow:hidden}
.coin-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.coin-card.pump::before{background:var(--pump)}.coin-card.dump::before{background:var(--dump)}.coin-card.neutral::before{background:var(--neutral)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.coin-symbol{font-size:20px;font-weight:800;letter-spacing:-0.02em;line-height:1;margin-bottom:3px}
.coin-label{font-size:11px;color:var(--muted);font-family:var(--mono)}
.verdict-pill{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;border:1px solid transparent;flex-shrink:0}
.verdict-pill.pump{background:rgba(0,229,160,0.1);color:var(--pump);border-color:rgba(0,229,160,0.2)}
.verdict-pill.dump{background:rgba(255,77,109,0.1);color:var(--dump);border-color:rgba(255,77,109,0.2)}
.verdict-pill.neutral{background:rgba(245,197,66,0.1);color:var(--neutral);border-color:rgba(245,197,66,0.2)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.metric{background:var(--surface2);border-radius:10px;padding:8px 10px}
.metric-label{font-size:10px;color:var(--muted);font-family:var(--mono);margin-bottom:3px}
.metric-value{font-size:14px;font-weight:700;font-family:var(--mono);line-height:1}
.metric-value.up{color:var(--pump)}.metric-value.down{color:var(--dump)}.metric-value.def{color:var(--text)}
.signals{display:flex;flex-direction:column;gap:6px}
.signal-row{display:flex;align-items:center;gap:8px}
.signal-label{font-size:11px;color:var(--muted2);width:80px;flex-shrink:0;font-family:var(--mono)}
.bar-track{flex:1;height:4px;background:var(--surface3);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px}
.bar-val{font-size:11px;font-family:var(--mono);width:32px;text-align:right;color:var(--muted2)}
.conf-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.conf-lbl{font-size:11px;color:var(--muted);font-family:var(--mono)}
.conf-val{font-size:13px;font-weight:700;font-family:var(--mono)}
.reason{font-size:12px;color:var(--muted2);line-height:1.5;margin-top:10px;padding:10px 12px;background:var(--surface3);border-radius:10px;font-style:italic}
.upcoming-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.upc-left{flex:1;min-width:0}
.upc-sym{font-size:18px;font-weight:800;letter-spacing:-0.02em;margin-bottom:3px;display:flex;align-items:center;gap:8px}
.new-badge{font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;background:rgba(123,111,255,0.15);color:var(--accent2);border:1px solid rgba(123,111,255,0.25);padding:2px 7px;border-radius:20px}
.upc-desc{font-size:12px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upc-time{text-align:right;flex-shrink:0}
.time-val{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--accent2);white-space:nowrap}
.time-lbl{font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.loading-row{display:flex;align-items:center;gap:10px;padding:40px 0;color:var(--muted2);font-size:13px;font-family:var(--mono);justify-content:center}
.spinner{width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--accent2);border-radius:50%;animation:spin 0.8s linear infinite}
.err{background:rgba(255,77,109,0.07);border:1px solid rgba(255,77,109,0.2);border-radius:12px;padding:14px 16px;font-size:13px;color:var(--dump);font-family:var(--mono);line-height:1.6}
.inf{background:rgba(123,111,255,0.07);border:1px solid rgba(123,111,255,0.2);border-radius:12px;padding:14px 16px;font-size:13px;color:var(--accent2);font-family:var(--mono);line-height:1.6}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px;font-family:var(--mono)}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo"><div class="logo-dot"></div>Listing Scout</div>
  <div style="display:flex;align-items:center;gap:10px">
    <span class="last-update" id="lu">--</span>
    <button class="refresh-btn" id="rb" onclick="loadAll()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      Scan
    </button>
  </div>
</div>
<div class="main" id="app"><div class="loading-row"><div class="spinner"></div>Initialising...</div></div>
<script type="text/javascript">
var PX='https://binance-proxy.radu-c-codreanu.workers.dev',ND=30;
var S={tab:'new',f:'all',nc:[],up:[],ln:false,lu:false,en:null,eu:null};
function pF(p){return fetch(PX+p,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()});}
function fK(s){return pF('/fapi/v1/klines?symbol='+s+'&interval=1h&limit=24').catch(function(){return[];});}
function fOI(s){return pF('/fapi/v1/openInterest?symbol='+s).then(function(d){return parseFloat(d.openInterest)||0;}).catch(function(){return 0;});}
function fUp(){return pF('/bapi/composite/v1/public/cms/article/list/query?type=1&pageNo=1&pageSize=20&catalogId=48').then(function(d){var art=d&&d.data&&d.data.articles?d.data.articles:[];var res=[];for(var i=0;i<art.length;i++){var a=art[i];var t=a.title||'';var sm=(t.match(/([A-Z]{2,10})USDT/g)||[]).filter(function(v,i,arr){return arr.indexOf(v)===i;});var dm=t.match(/(d{4}-d{2}-d{2})/);var ld=dm?new Date(dm[1]).getTime():null;for(var j=0;j<sm.length;j++){var b=sm[j].replace('USDT','');res.push({symbol:b+'/USDT',base:b,title:t.length>80?t.slice(0,77)+'...':t,listDate:ld,ad:a.releaseDate||Date.now()});}}var seen={};var out=[];for(var k=0;k<res.length;k++){var r=res[k];if(!seen[r.base]||r.ad>seen[r.base].ad)seen[r.base]=r;}for(var key in seen)out.push(seen[key]);return out.slice(0,10);});}
function az(o){var chg=parseFloat(o.priceChangePercent)||0,vol=parseFloat(o.quoteVolume)||0,tc=parseInt(o.count)||0;var mom=Math.min(100,Math.max(0,50+chg*2)),volS=Math.min(100,(vol/5e6)*40+30),act=Math.min(100,(tc/5e4)*100);var tr=50;var kl=o.klines||[];if(kl.length>=6){var cl=kl.slice(-12).map(function(k){return parseFloat(k[4]);});var n=cl.length,xm=(n-1)/2,ym=cl.reduce(function(a,b){return a+b;},0)/n;var nu=0,de=0;cl.forEach(function(y,x){nu+=(x-xm)*(y-ym);de+=(x-xm)*(x-xm);});var sl=de?nu/de:0;tr=Math.min(100,Math.max(0,50+(ym?(sl/ym)*100:0)*20));}var oiS=Math.min(100,o.oi>0?Math.log(o.oi+1)/Math.LN10*20:40);var ag=(Date.now()-o.openTime)/864e5,fr=ag<3?70:ag<7?62:ag<14?54:42;var sc=Math.round(mom*.3+volS*.2+tr*.2+act*.1+oiS*.1+fr*.1);var vd=sc>=62?'pump':sc<=42?'dump':'neutral';return{mom:mom,vol:volS,act:act,tr:tr,sc:sc,vd:vd,cf:Math.max(10,Math.min(98,Math.round(Math.abs(sc-50)*2)))};}
function br(tk,an,ot){var chg=parseFloat(tk.priceChangePercent||0).toFixed(1),vol=parseFloat(tk.quoteVolume||0),vs=vol>=1e9?'$'+(vol/1e9).toFixed(1)+'B':vol>=1e6?'$'+(vol/1e6).toFixed(0)+'M':'$'+(vol/1e3).toFixed(0)+'K',ag=Math.round((Date.now()-ot)/864e5),ts=Math.round(an.tr);if(an.vd==='pump')return'+'+chg+'% in 24h, '+vs+' vol. Trend '+ts+'/100 - momentum building. Listed '+ag+'d ago.';if(an.vd==='dump')return chg+'%, '+vs+' vol. Trend '+ts+'/100 - distribution signal.';return chg+'% move. Mixed signals ('+an.sc+'/100) - watch for breakout.';}
function lNL(){S.ln=true;S.en=null;rd();return Promise.all([pF('/fapi/v1/exchangeInfo'),pF('/fapi/v1/ticker/24hr')]).then(function(res){var ex=res[0],tk=res[1];var ob={};(ex.symbols||[]).forEach(function(s){if(s.quoteAsset==='USDT'&&s.contractType==='PERPETUAL'&&s.status==='TRADING')ob[s.symbol]=s.onboardDate;});var tm={};tk.forEach(function(t){tm[t.symbol]=t;});var cu=Date.now()-ND*864e5;var ns=Object.entries(ob).filter(function(e){return e[1]>=cu;}).sort(function(a,b){return b[1]-a[1];}).slice(0,14).map(function(e){return{sym:e[0],ot:e[1]};});return Promise.all(ns.map(function(n){var t=tm[n.sym]||{};return Promise.all([fK(n.sym),fOI(n.sym)]).then(function(r){var a=az(Object.assign({},t,{klines:r[0],oi:r[1],openTime:n.ot}));return{sym:n.sym,ot:n.ot,t:t,a:a,r:br(t,a,n.ot)};});}));}).then(function(en){S.nc=en.sort(function(a,b){return b.a.sc-a.a.sc;});}).catch(function(e){S.en=e.message;}).then(function(){S.ln=false;rd();});}
function lUp(){S.lu=true;S.eu=null;rd();return fUp().then(function(u){S.up=u;}).catch(function(e){S.eu=e.message;}).then(function(){S.lu=false;rd();});}
function loadAll(){var b=document.getElementById('rb');if(b)b.classList.add('spinning');return Promise.all([lNL(),lUp()]).then(function(){var el=document.getElementById('lu');if(el)el.textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});var b=document.getElementById('rb');if(b)b.classList.remove('spinning');});}
function fp(n){var v=parseFloat(n);if(!v)return'--';if(v>=1000)return'$'+v.toLocaleString('en',{maximumFractionDigits:0});if(v>=1)return'$'+v.toFixed(3);return'$'+v.toPrecision(4);}
function fv(n){var v=parseFloat(n);if(!v)return'--';if(v>=1e9)return'$'+(v/1e9).toFixed(1)+'B';if(v>=1e6)return'$'+(v/1e6).toFixed(0)+'M';if(v>=1e3)return'$'+(v/1e3).toFixed(0)+'K';return'$'+v.toFixed(0);}
function vc(v){return v==='pump'?'var(--pump)':v==='dump'?'var(--dump)':'var(--neutral)';}
function sb(v,c){var p=Math.round(v);return '<div class="bar-track"><div class="bar-fill" style="width:'+p+'%;background:'+c+'"></div></div><span class="bar-val">'+p+'</span>';}
function rCC(coin){var sym=coin.sym,t=coin.t,a=coin.a,r=coin.r,ot=coin.ot,vd=a.vd,cf=a.cf,sc=a.sc,mom=a.mom,vol=a.vol,tr=a.tr,act=a.act,sh=sym.replace('USDT',''),chg=parseFloat(t.priceChangePercent||0),cc=chg>0?'up':chg<0?'down':'def',cs=(chg>0?'+':'')+chg.toFixed(2)+'%',ag=Math.round((Date.now()-ot)/864e5),col=vc(vd),ic=vd==='pump'?'&#9650;':vd==='dump'?'&#9660;':'&#9670;',lb=vd==='pump'?'PUMP':vd==='dump'?'DUMP':'WATCH';return '<div class="coin-card '+vd+'"><div class="card-top"><div><div class="coin-symbol">'+sh+'</div><div class="coin-label">USDT PERP &middot; '+ag+'d ago</div></div><div class="verdict-pill '+vd+'">'+ic+' '+lb+'</div></div><div class="metrics"><div class="metric"><div class="metric-label">PRICE</div><div class="metric-value def">'+fp(t.lastPrice)+'</div></div><div class="metric"><div class="metric-label">24H</div><div class="metric-value '+cc+'">'+cs+'</div></div><div class="metric"><div class="metric-label">VOL</div><div class="metric-value def">'+fv(t.quoteVolume)+'</div></div></div><div class="signals"><div class="signal-row"><span class="signal-label">momentum</span>'+sb(mom,col)+'</div><div class="signal-row"><span class="signal-label">volume</span>'+sb(vol,col)+'</div><div class="signal-row"><span class="signal-label">trend</span>'+sb(tr,col)+'</div><div class="signal-row"><span class="signal-label">activity</span>'+sb(act,col)+'</div></div><div class="conf-row"><span class="conf-lbl">SCORE</span><span class="conf-val" style="color:'+col+'">'+sc+'/100 &middot; '+cf+'% conf</span></div><div class="reason">'+r+'</div></div>';}
function rUC(item){var now=Date.now(),diff=item.listDate?item.listDate-now:null,ts,tl;if(diff===null){ts='TBA';tl='unconfirmed';}else if(diff<0){ts='Listed';tl='recently';}else if(diff<36e5){ts=Math.floor(diff/6e4)+'m';tl='until listing';}else if(diff<864e5){ts=Math.floor(diff/36e5)+'h '+Math.floor((diff%36e5)/6e4)+'m';tl='until listing';}else{ts=Math.ceil(diff/864e5)+'d';tl='until listing';}return '<div class="upcoming-card"><div class="upc-left"><div class="upc-sym">'+item.symbol+' <span class="new-badge">NEW</span></div><div class="upc-desc">'+item.title+'</div></div><div class="upc-time"><div class="time-val">'+ts+'</div><div class="time-lbl">'+tl+'</div></div></div>';}
function rd(){var app=document.getElementById('app');if(!app)return;var fl=S.f==='all'?S.nc:S.nc.filter(function(c){return c.a.vd===S.f;});var pu=S.nc.filter(function(c){return c.a.vd==='pump';}).length,du=S.nc.filter(function(c){return c.a.vd==='dump';}).length,ne=S.nc.filter(function(c){return c.a.vd==='neutral';}).length;var h='<div class="tab-bar"><div class="tab '+(S.tab==='new'?'active':'')+'" onclick="st('new')">New Listings</div><div class="tab '+(S.tab==='upcoming'?'active':'')+'" onclick="st('upcoming')">Upcoming</div></div>';if(S.tab==='new'){if(!S.ln&&S.nc.length>0){h+='<div class="summary-bar"><div class="summary-item"><div class="summary-dot pump"></div><span class="summary-num" style="color:var(--pump)">'+pu+'</span><span class="summary-txt">pump</span></div><div class="summary-divider"></div><div class="summary-item"><div class="summary-dot dump"></div><span class="summary-num" style="color:var(--dump)">'+du+'</span><span class="summary-txt">dump</span></div><div class="summary-divider"></div><div class="summary-item"><div class="summary-dot neutral"></div><span class="summary-num" style="color:var(--neutral)">'+ne+'</span><span class="summary-txt">watch</span></div><div class="summary-divider"></div><div class="summary-item"><span class="summary-num">'+S.nc.length+'</span><span class="summary-txt">total</span></div></div><div class="filter-row"><div class="chip '+(S.f==='all'?'active':'')+'" onclick="sf('all')">All</div><div class="chip pump '+(S.f==='pump'?'active':'')+'" onclick="sf('pump')">&#9650; Pump</div><div class="chip dump '+(S.f==='dump'?'active':'')+'" onclick="sf('dump')">&#9660; Dump</div><div class="chip neutral '+(S.f==='neutral'?'active':'')+'" onclick="sf('neutral')">&#9670; Watch</div></div>';}if(S.ln){h+='<div class="loading-row"><div class="spinner"></div>Scanning...</div>';}else if(S.en){h+='<div class="err">Error: '+S.en+'</div>';}else if(fl.length===0){h+='<div class="empty">No coins match.</div>';}else{for(var i=0;i<fl.length;i++)h+=rCC(fl[i]);}}else{if(S.lu){h+='<div class="loading-row"><div class="spinner"></div>Fetching...</div>';}else if(S.eu){h+='<div class="err">Error: '+S.eu+'</div>';}else if(S.up.length===0){h+='<div class="inf">No upcoming listings found.</div>';}else{for(var i=0;i<S.up.length;i++)h+=rUC(S.up[i]);}}app.innerHTML=h;}
function st(t){S.tab=t;rd();}
function sf(f){S.f=f;rd();}
loadAll();
</script>
</body>
</html>
