<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Listing Scout">
<title>Listing Scout</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--surface:#111118;--surface2:#18181f;--surface3:#20202a;--surface4:#262633;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);--text:#f0f0f5;--muted:#6b6b80;--muted2:#9090a8;--pump:#00e5a0;--dump:#ff4d6d;--neutral:#f5c542;--accent2:#a78bfa;--mono:'Space Mono',monospace;--sans:'Syne',sans-serif;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden}
.topbar{position:sticky;top:0;z-index:100;background:rgba(10,10,15,0.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:calc(var(--safe-top) + 12px) 16px 12px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:17px;font-weight:800;letter-spacing:-0.02em;display:flex;align-items:center;gap:8px}
.logo-dot{width:8px;height:8px;border-radius:50%;background:var(--pump);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(0.85)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flashUp{0%{box-shadow:0 0 0 rgba(0,229,160,0)}50%{box-shadow:0 0 0 999px rgba(0,229,160,0.03)}100%{box-shadow:0 0 0 rgba(0,229,160,0)}}
@keyframes flashDown{0%{box-shadow:0 0 0 rgba(255,77,109,0)}50%{box-shadow:0 0 0 999px rgba(255,77,109,0.03)}100%{box-shadow:0 0 0 rgba(255,77,109,0)}}
.refresh-btn{background:var(--surface2);border:1px solid var(--border2);color:var(--text);font-family:var(--sans);font-size:13px;font-weight:600;padding:7px 14px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px}
.refresh-btn.spinning svg{animation:spin 0.8s linear infinite}
.last-update{font-family:var(--mono);font-size:11px;color:var(--muted)}
.main{padding:16px 16px calc(var(--safe-bottom) + 60px);max-width:480px;margin:0 auto}
.tab-bar{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:16px}
.tab{flex:1;padding:9px 12px;border-radius:9px;font-size:13px;font-weight:600;text-align:center;cursor:pointer;color:var(--muted2)}
.tab.active{background:var(--surface3);color:var(--text);border:1px solid var(--border2)}
.summary-bar{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:16px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.summary-item{display:flex;align-items:center;gap:6px;flex-shrink:0}
.summary-dot{width:8px;height:8px;border-radius:50%}
.summary-dot.pump{background:var(--pump)}.summary-dot.dump{background:var(--dump)}.summary-dot.neutral{background:var(--neutral)}.summary-dot.accent{background:var(--accent2)}
.summary-num{font-family:var(--mono);font-size:15px;font-weight:700}
.summary-txt{font-size:11px;color:var(--muted2);text-transform:uppercase;letter-spacing:0.06em}
.summary-divider{width:1px;height:24px;background:var(--border);flex-shrink:0}
.filter-row{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.chip{flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--muted2)}
.chip.active{background:var(--surface3);color:var(--text);border-color:var(--border2)}
.chip.pump.active{background:rgba(0,229,160,0.1);color:var(--pump);border-color:rgba(0,229,160,0.25)}
.chip.dump.active{background:rgba(255,77,109,0.1);color:var(--dump);border-color:rgba(255,77,109,0.25)}
.chip.neutral.active{background:rgba(245,197,66,0.1);color:var(--neutral);border-color:rgba(245,197,66,0.25)}
.chip.accent.active{background:rgba(167,139,250,0.1);color:var(--accent2);border-color:rgba(167,139,250,0.25)}
.refresh-strip{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.refresh-meta{display:flex;flex-direction:column;gap:4px;min-width:0}
.refresh-title{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted2);font-family:var(--mono)}
.refresh-sub{font-size:11px;color:var(--muted);font-family:var(--mono)}
.refresh-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.toggle-btn{appearance:none;border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-family:var(--mono);font-size:10px;font-weight:700;padding:6px 10px;border-radius:18px;cursor:pointer}
.toggle-btn.on{border-color:rgba(0,229,160,0.24);color:var(--pump);background:rgba(0,229,160,0.08)}
.coin-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:10px;position:relative;overflow:hidden;transition:border-color .25s ease,transform .25s ease,box-shadow .25s ease}
.coin-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.coin-card.pump::before{background:var(--pump)}.coin-card.dump::before{background:var(--dump)}.coin-card.neutral::before{background:var(--neutral)}
.coin-card.changed-up{border-color:rgba(0,229,160,0.24);animation:flashUp 1.6s ease}
.coin-card.changed-down{border-color:rgba(255,77,109,0.24);animation:flashDown 1.6s ease}
.coin-card.new-card{border-color:rgba(167,139,250,0.28);box-shadow:0 0 0 1px rgba(167,139,250,0.14) inset}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;gap:10px}
.coin-symbol{font-size:20px;font-weight:800;letter-spacing:-0.02em;line-height:1;margin-bottom:3px}
.coin-label{font-size:11px;color:var(--muted);font-family:var(--mono)}
.card-details{margin-top:10px}
.card-details>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);font-family:var(--mono);font-size:11px;color:var(--muted2)}
.card-details>summary::-webkit-details-marker{display:none}
.details-caret{font-size:12px;color:var(--muted2);transition:transform .2s ease}
.card-details[open] .details-caret{transform:rotate(90deg)}
.details-body{padding-top:12px}
.verdict-pill{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;border:1px solid transparent;flex-shrink:0}
.verdict-pill.pump{background:rgba(0,229,160,0.1);color:var(--pump);border-color:rgba(0,229,160,0.2)}
.verdict-pill.dump{background:rgba(255,77,109,0.1);color:var(--dump);border-color:rgba(255,77,109,0.2)}
.verdict-pill.neutral{background:rgba(245,197,66,0.1);color:var(--neutral);border-color:rgba(245,197,66,0.2)}
.mode-line{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mode-pill{font-size:10px;font-weight:700;padding:4px 8px;border-radius:20px;font-family:var(--mono);letter-spacing:0.04em;border:1px solid var(--border);background:rgba(255,255,255,0.03);color:var(--muted2)}
.mode-pill.primary{color:var(--text);border-color:var(--border2);background:rgba(255,255,255,0.06)}
.mode-pill.cont{color:var(--pump);border-color:rgba(0,229,160,0.22);background:rgba(0,229,160,0.11)}
.mode-pill.dump{color:var(--dump);border-color:rgba(255,77,109,0.22);background:rgba(255,77,109,0.11)}
.mode-pill.squeeze{color:var(--accent2);border-color:rgba(167,139,250,0.22);background:rgba(167,139,250,0.11)}
.mode-pill.swing{color:var(--neutral);border-color:rgba(245,197,66,0.22);background:rgba(245,197,66,0.11)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.metric{background:var(--surface2);border-radius:10px;padding:8px 10px}
.metric-label{font-size:10px;color:var(--muted);font-family:var(--mono);margin-bottom:3px}
.metric-value{font-size:14px;font-weight:700;font-family:var(--mono);line-height:1}
.metric-value.up{color:var(--pump)}.metric-value.down{color:var(--dump)}.metric-value.def{color:var(--text)}
.signals{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.signal-row{display:flex;align-items:center;gap:8px}
.signal-label{font-size:11px;color:var(--muted2);width:84px;flex-shrink:0;font-family:var(--mono)}
.bar-track{flex:1;height:4px;background:var(--surface3);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px}
.bar-val{font-size:11px;font-family:var(--mono);width:32px;text-align:right;color:var(--muted2)}
.ai-section,.watch-levels,.entry-map,.regime-grid,.delta-panel,.mtf-panel,.freshness-panel{margin-top:12px;border-top:1px solid var(--border);padding-top:12px}
.ai-header,.watch-head,.map-head,.regime-head,.delta-head,.mtf-head,.fresh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:12px}
.ai-label,.watch-title,.map-title,.regime-title,.delta-title,.mtf-title,.fresh-title{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted2);font-family:var(--mono)}
.ai-prob{font-size:13px;font-weight:700;font-family:var(--mono);text-align:right}
.ai-body{font-size:12px;color:var(--muted2);line-height:1.6;background:var(--surface3);border-radius:10px;padding:10px 12px}
.ai-score-grid,.regime-cards,.delta-grid,.fresh-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px;margin-bottom:10px}
.ai-score,.regime-card,.delta-box,.fresh-box{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:10px;padding:8px 9px}
.ai-score-lbl,.regime-lbl,.delta-lbl,.fresh-lbl{font-size:9px;color:var(--muted);font-family:var(--mono);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:4px}
.ai-score-val,.regime-val,.delta-val,.fresh-val{font-size:15px;font-weight:700;font-family:var(--mono);line-height:1}
.ai-score-sub,.regime-sub,.delta-sub,.fresh-sub{font-size:10px;color:var(--muted2);font-family:var(--mono);margin-top:4px}
.ai-mini-bar,.fresh-bar{height:4px;background:rgba(255,255,255,0.05);border-radius:4px;overflow:hidden;margin-top:7px}
.ai-mini-fill,.fresh-fill{height:100%;border-radius:4px}
.ai-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ai-meta-pill,.map-pill,.regime-pill,.delta-pill,.fresh-pill,.mtf-pill{font-size:10px;font-family:var(--mono);padding:3px 8px;border-radius:20px;background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--muted2)}
.watch-help,.map-help,.delta-help,.fresh-help{font-size:10px;color:var(--muted);font-family:var(--mono);text-align:right}
.level-row,.map-row,.delta-row,.mtf-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:8px 0;border-top:1px solid rgba(255,255,255,0.04)}
.level-row:first-of-type,.map-row:first-of-type,.delta-row:first-of-type,.mtf-row:first-of-type{border-top:0;padding-top:0}
.level-main,.map-main,.delta-main,.mtf-main{min-width:0}
.level-label,.map-label,.delta-label,.mtf-label{font-size:12px;font-weight:700;color:var(--text);margin-bottom:3px}
.level-note,.map-note,.delta-note,.mtf-note{font-size:11px;color:var(--muted2);line-height:1.4}
.level-side,.map-side,.delta-side,.mtf-side{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.level-price,.map-price,.delta-price,.mtf-state{font-size:13px;font-weight:700;font-family:var(--mono)}
.level-price.pump,.map-price.pump,.mtf-state.pump{color:var(--pump)}.level-price.dump,.map-price.dump,.mtf-state.dump{color:var(--dump)}.level-price.neutral,.map-price.neutral,.mtf-state.neutral{color:var(--neutral)}
.level-actions,.map-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.level-btn,.map-btn{appearance:none;border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-family:var(--mono);font-size:10px;font-weight:700;padding:5px 8px;border-radius:8px;cursor:pointer;text-decoration:none}
.level-btn.link{color:var(--accent2)}
.level-btn.pump,.map-btn.pump{border-color:rgba(0,229,160,0.22);color:var(--pump)}
.level-btn.dump,.map-btn.dump{border-color:rgba(255,77,109,0.22);color:var(--dump)}
.level-btn.neutral,.map-btn.neutral{border-color:rgba(245,197,66,0.22);color:var(--neutral)}
.ai-loading{font-size:12px;color:var(--muted);font-family:var(--mono);font-style:italic;padding:8px 0;display:flex;align-items:center;gap:8px}
.ai-spinner{width:12px;height:12px;border:1.5px solid var(--border2);border-top-color:var(--accent2);border-radius:50%;animation:spin 0.8s linear infinite;flex-shrink:0}
.signal-flags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.flag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;font-family:var(--mono);letter-spacing:0.04em}
.flag.bull{background:rgba(0,229,160,0.12);color:var(--pump);border:1px solid rgba(0,229,160,0.2)}
.flag.bear{background:rgba(255,77,109,0.12);color:var(--dump);border:1px solid rgba(255,77,109,0.2)}
.flag.warn{background:rgba(245,197,66,0.12);color:var(--neutral);border:1px solid rgba(245,197,66,0.2)}
.flag.info{background:rgba(167,139,250,0.12);color:var(--accent2);border:1px solid rgba(167,139,250,0.2)}
.prob-bar{height:6px;background:var(--surface3);border-radius:4px;overflow:hidden;margin-top:6px;margin-bottom:4px}
.prob-fill{height:100%;border-radius:4px;transition:width 1s ease}
.prob-labels{display:flex;justify-content:space-between;font-size:10px;font-family:var(--mono);color:var(--muted)}
.upcoming-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.upc-left{flex:1;min-width:0}
.upc-sym{font-size:18px;font-weight:800;letter-spacing:-0.02em;margin-bottom:3px;display:flex;align-items:center;gap:8px}
.new-badge{font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;background:rgba(123,111,255,0.15);color:var(--accent2);border:1px solid rgba(123,111,255,0.25);padding:2px 7px;border-radius:20px}
.upc-desc{font-size:12px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upc-time{text-align:right;flex-shrink:0}
.time-val{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--accent2);white-space:nowrap}
.time-lbl{font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.radar-section{margin-bottom:18px}
.radar-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px}
.radar-title{font-size:12px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;font-family:var(--mono);color:var(--text)}
.radar-sub{font-size:11px;color:var(--muted2);max-width:70%;text-align:right}
.radar-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:15px 16px;margin-bottom:10px;position:relative;overflow:hidden}
.radar-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent2)}
.radar-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.radar-symbol{font-size:19px;font-weight:800;letter-spacing:-0.02em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.radar-base{font-size:11px;color:var(--muted);font-family:var(--mono)}
.radar-score{min-width:72px;text-align:right}
.radar-score-num{font-family:var(--mono);font-size:18px;font-weight:800}
.radar-score-lbl{font-size:10px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:0.08em}
.radar-why{font-size:13px;line-height:1.5;color:var(--text);margin-bottom:8px}
.radar-reasons{font-size:12px;color:var(--muted2);line-height:1.55;padding-left:16px;margin-bottom:10px}
.radar-reasons li{margin-bottom:4px}
.radar-tags,.radar-evidence{display:flex;flex-wrap:wrap;gap:6px}
.radar-evidence{margin-top:8px}
.radar-meta-pill{font-size:10px;font-family:var(--mono);padding:4px 8px;border-radius:20px;background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--muted2)}
.radar-empty{background:var(--surface);border:1px dashed var(--border2);border-radius:14px;padding:14px 16px;font-size:12px;color:var(--muted);font-family:var(--mono)}
.loading-row{display:flex;align-items:center;gap:10px;padding:40px 0;color:var(--muted2);font-size:13px;font-family:var(--mono);justify-content:center}
.spinner{width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--accent2);border-radius:50%;animation:spin 0.8s linear infinite}
.err{background:rgba(255,77,109,0.07);border:1px solid rgba(255,77,109,0.2);border-radius:12px;padding:14px 16px;font-size:13px;color:var(--dump);font-family:var(--mono);line-height:1.6}
.inf{background:rgba(123,111,255,0.07);border:1px solid rgba(123,111,255,0.2);border-radius:12px;padding:14px 16px;font-size:13px;color:var(--accent2);font-family:var(--mono);line-height:1.6}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px;font-family:var(--mono)}
@media (max-width:420px){.metrics{grid-template-columns:repeat(2,1fr)}.ai-score-grid,.regime-cards,.delta-grid,.fresh-grid{grid-template-columns:1fr}.level-row,.map-row,.delta-row,.mtf-row{grid-template-columns:1fr}.level-side,.map-side,.delta-side,.mtf-side{align-items:flex-start;text-align:left}.refresh-strip{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>

<script type="text/javascript">
var PX='https://binance-proxy.radu-c-codreanu.workers.dev',ND=30,LIST_CAP=30,REFRESH_MS=90000,PERSIST_KEY='listingScoutStateV2';
var RADAR_WINDOW_DAYS=120,RADAR_SPOT_ONLY_LIMIT=12,RADAR_EARLY_LIMIT=12;
var S={tab:'new',f:'all',listingScope:'recent',nc:[],up:[],radar:null,ln:false,lu:false,lr:false,en:null,eu:null,er:null,autoRefresh:true,lastRefreshTs:0,nextRefreshTs:0,refreshTimer:null,tickTimer:null,changes:{},persist:{snapshots:{},autoRefresh:true,lastListTs:0,listingScope:'recent'},manualRefreshSeq:0};
var aiCache={};

function pF(p){return fetch(PX+p,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()});}
function fK(s,i,l){return pF('/fapi/v1/klines?symbol='+s+'&interval='+(i||'1h')+'&limit='+(l||48)).catch(function(){return[];});}
function fOI(s){return pF('/fapi/v1/openInterest?symbol='+s).then(function(d){return parseFloat(d.openInterest)||0;}).catch(function(){return 0;});}

h+='<div class="signals">';h+='<div class="signal-row"><span class="signal-label">momentum</span>'+sb(mom,col)+'</div>';h+='<div class="signal-row"><span class="signal-label">volume</span>'+sb(vol,col)+'</div>';h+='<div class="signal-row"><span class="signal-label">trend</span>'+sb(tr,col)+'</div>';h+='<div class="signal-row"><span class="signal-label">activity</span>'+sb(act,col)+'</div>';h+='</div>';h+=renderAI(coin);h+='</div></details></div>';return h;}

function rUC(item){var now=Date.now(),diff=item.listDate?item.listDate-now:null,ts,tl;if(diff===null){ts='TBA';tl='unconfirmed';}else if(diff<0){ts='Listed';tl='recently';}else if(diff<36e5){ts=Math.floor(diff/6e4)+'m';tl='until listing';}else if(diff<864e5){ts=Math.floor(diff/36e5)+'h '+Math.floor((diff%36e5)/6e4)+'m';tl='until listing';}else{ts=Math.ceil(diff/864e5)+'d';tl='until listing';}return '<div class="upcoming-card"><div class="upc-left"><div class="upc-sym">'+item.symbol+' <span class="new-badge">NEW</span></div><div class="upc-desc">'+item.title+'</div></div><div class="upc-time"><div class="time-val">'+ts+'</div><div class="time-lbl">'+tl+'</div></div></div>';}
function renderRadarCard(item){var score=Math.round(item.confidence||0),scoreColor=scoreTone(score),reasonHtml='';for(var i=0;i<Math.min((item.reasons||[]).length,3);i++)reasonHtml+='<li>'+escHtml(item.reasons[i])+'</li>';var tags=(item.tags||[]).map(function(tag){return '<span class="flag '+tagClass(tag)+'">'+escHtml(tag)+'</span>';}).join('');var evidence=(item.evidence||[]).slice(0,3).map(function(ev){return '<span class="radar-meta-pill">'+escHtml(ev)+'</span>';}).join('');return '<div class="radar-card"><div class="radar-top"><div><div class="radar-symbol">'+escHtml(item.base)+' <span class="new-badge">'+escHtml(item.category)+'</span></div><div class="radar-base">'+escHtml(item.symbol||item.base+'/USDT')+(item.listDate?' • '+fmtShortDate(item.listDate):'')+'</div></div><div class="radar-score"><div class="radar-score-num" style="color:'+scoreColor+'">'+score+'</div><div class="radar-score-lbl">confidence</div></div></div><div class="radar-why">'+escHtml(item.why||'')+'</div>'+(reasonHtml?'<ul class="radar-reasons">'+reasonHtml+'</ul>':'')+'<div class="radar-tags">'+tags+'</div>'+(evidence?'<div class="radar-evidence">'+evidence+'</div>':'')+'</div>';}
function renderRadar(){if(S.lr)return '<div class="loading-row"><div class="spinner"></div>Building radar...</div>';if(S.er)return '<div class="err">Error: '+escHtml(S.er)+'</div>';if(!S.radar||!S.radar.sections)return '<div class="inf">Radar not ready yet.</div>';var h='<div class="inf">Upcoming Radar blends official Binance announcements with broader public Binance clues: Launchpool/ecosystem activity, article mentions, asset-catalog presence, and spot-vs-perp gaps. Lower buckets are heuristic and intentionally exploratory.</div>';for(var i=0;i<S.radar.sections.length;i++){var sec=S.radar.sections[i],items=sec.items||[];h+='<div class="radar-section"><div class="radar-head"><div class="radar-title">'+escHtml(sec.title)+'</div><div class="radar-sub">'+escHtml(sec.hint||'')+'</div></div>';if(!items.length)h+='<div class="radar-empty">No candidates in this bucket right now.</div>';else for(var j=0;j<items.length;j++)h+=renderRadarCard(items[j]);h+='</div>';}return h;}
function renderRefreshStrip(){var next=S.autoRefresh?Math.max(0,Math.ceil((S.nextRefreshTs-Date.now())/1000)):0;return '<div class="refresh-strip"><div class="refresh-meta"><div class="refresh-title">Auto-refresh</div><div class="refresh-sub">'+(S.autoRefresh?'Scanning every '+Math.round(REFRESH_MS/1000)+'s • next in ':'Paused • manual scans only')+'<span id="countdown">'+(S.autoRefresh?next+'s':'--')+'</span></div></div><div class="refresh-actions"><button class="toggle-btn '+(S.autoRefresh?'on':'')+'" onclick="toggleAutoRefresh()">'+(S.autoRefresh?'ON':'OFF')+'</button></div></div>';}

function rd(){var app=document.getElementById('app');if(!app)return;var fl=S.nc;if(S.f!=='all'){fl=S.nc.filter(function(c){if(S.f==='pump'||S.f==='dump'||S.f==='neutral')return gVerdict(c)===S.f;if(S.f==='postdump')return gMode(c)==='dump';return gMode(c)===S.f;});}var pu=S.nc.filter(function(c){return gVerdict(c)==='pump';}).length;var du=S.nc.filter(function(c){return gVerdict(c)==='dump';}).length;var ne=S.nc.filter(function(c){return gVerdict(c)==='neutral';}).length;var ct=S.nc.filter(function(c){return gMode(c)==='continuation';}).length;var dp=S.nc.filter(function(c){return gMode(c)==='dump';}).length;var sq=S.nc.filter(function(c){return gMode(c)==='squeeze';}).length;var sw=S.nc.filter(function(c){return gMode(c)==='swing';}).length;var usdtCount=S.nc.filter(function(c){return (c.quote||'USDT')==='USDT';}).length;var usdcCount=S.nc.filter(function(c){return (c.quote||'USDT')==='USDC';}).length;var h='<div class="tab-bar"><div class="tab '+(S.tab==='new'?'active':'')+'" onclick="st(\'new\')">New Listings</div><div class="tab '+(S.tab==='upcoming'?'active':'')+'" onclick="st(\'upcoming\')">Upcoming Radar</div></div>';if(S.tab==='new'){h+=renderRefreshStrip();if(!S.ln&&S.nc.length>0){h+='<div class="summary-bar"><div class="summary-item"><div class="summary-dot pump"></div><span class="summary-num" style="color:var(--pump)">'+pu+'</span><span class="summary-txt">pump</span></div><div class="summary-divider"></div><div class="summary-item"><div class="summary-dot dump"></div><span class="summary-num" style="color:var(--dump)">'+du+'</span><span class="summary-txt">dump</span></div><div class="summary-divider"></div><div class="summary-item"><div class="summary-dot neutral"></div><span class="summary-num" style="color:var(--neutral)">'+ne+'</span><span class="summary-txt">watch</span></div><div class="summary-divider"></div><div class="summary-item"><div class="summary-dot accent"></div><span class="summary-num" style="color:var(--accent2)">'+sq+'</span><span class="summary-txt">traps</span></div><div class="summary-divider"></div><div class="summary-item"><span class="summary-num">'+S.nc.length+'</span><span class="summary-txt">total</span></div></div>';h+='<div class="filter-row"><div class="chip '+(S.listingScope==='recent'?'active':'')+'" onclick="setListingScope(\'recent\')">Recent 30d</div><div class="chip '+(S.listingScope==='all'?'active':'')+'" onclick="setListingScope(\'all\')">All</div><div class="chip '+(S.f==='all'?'active':'')+'" onclick="sf(\'all\')">All</div><div class="chip pump '+(S.f==='pump'?'active':'')+'" onclick="sf(\'pump\')">&#9650; Pump</div><div class="chip dump '+(S.f==='dump'?'active':'')+'" onclick="sf(\'dump\')">&#9660; Dump</div><div class="chip neutral '+(S.f==='neutral'?'active':'')+'" onclick="sf(\'neutral\')">&#9670; Watch</div><div class="chip pump '+(S.f==='continuation'?'active':'')+'" onclick="sf(\'continuation\')">Continue '+ct+'</div><div class="chip dump '+(S.f==='postdump'?'active':'')+'" onclick="sf(\'postdump\')">Post-dump '+dp+'</div><div class="chip accent '+(S.f==='squeeze'?'active':'')+'" onclick="sf(\'squeeze\')">Trap '+sq+'</div><div class="chip neutral '+(S.f==='swing'?'active':'')+'" onclick="sf(\'swing\')">Swing '+sw+'</div><div class="chip '+((S.listingScope==='all'||usdtCount>0)?'active':'')+'" onclick="void(0)">USDT '+usdtCount+'</div><div class="chip '+((S.listingScope==='all'||usdcCount>0)?'active':'')+'" onclick="void(0)">USDC '+usdcCount+'</div></div>';}if(S.ln){h+='<div class="loading-row"><div class="spinner"></div>Scanning...</div>';}else if(S.en){h+='<div class="err">Error: '+S.en+'</div>';}else if(fl.length===0){h+='<div class="empty">No coins match.</div>';}else{for(var i=0;i<fl.length;i++)h+=rCC(fl[i]);}}else{h+=renderRefreshStrip();h+=renderRadar();}app.innerHTML=h;}
function st(t){S.tab=t;rd();}
function sf(f){S.f=f;rd();}
loadPersist();
loadAll(false);
</script>
